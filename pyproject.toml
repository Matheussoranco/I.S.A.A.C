[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isaac"
version = "1.5.0"
description = "Intelligent System for Autonomous Action and Cognition — neuro-symbolic autonomous agent"
readme = "README.md"
# CC BY-NC-SA 4.0 — noncommercial use only, and any derivative you share must
# carry the same terms (ShareAlike / copyleft). Not an OSI-approved licence,
# hence the "Other/Proprietary" classifier.
license = { text = "CC-BY-NC-SA-4.0" }
requires-python = ">=3.10"
authors = [{ name = "Matheus Soranço", email = "matheussoranco@gmail.com" }]
keywords = ["agent", "agi", "neuro-symbolic", "langgraph", "code-agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: Other/Proprietary License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-ollama>=0.2",
    "docker>=7.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.26",
    "chromadb>=0.5",
    "networkx>=3.2",
    "typer>=0.12",
    "duckduckgo-search>=6.0",
    "python-telegram-bot>=21.0",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "croniter>=2.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # Pinned: ruff formatting changes between minor versions broke CI at 0.4.0.
    "ruff==0.15.2",
    "mypy>=1.13",
]
browser = [
    "playwright>=1.44",
]
calendar = [
    "caldav>=1.3",
    "icalendar>=5.0",
]
audio = [
    "faster-whisper>=1.0",
    "pyttsx3>=2.90",
    "sounddevice>=0.4",
    "soundfile>=0.12",
]
audio-neural = [
    "kokoro>=0.9",
    "soundfile>=0.12",
]
document = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "pytesseract>=0.3",
    "Pillow>=10.0",
]
reasoning = [
    "z3-solver>=4.13",
]
benchmarks = [
    "huggingface_hub>=0.24",
    "pyarrow>=15.0",
]
vision = [
    "mss>=9.0",
    "pillow>=10.0",
]
voice = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "webrtcvad>=2.0",
    "piper-tts>=1.2",
    "pyttsx3>=2.90",
]
multimodal = [
    "faster-whisper>=1.0",
    "pyttsx3>=2.90",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pytesseract>=0.3",
    "Pillow>=10.0",
    "mss>=9.0",
]
all = [
    "playwright>=1.44",
    "caldav>=1.3",
    "icalendar>=5.0",
    "faster-whisper>=1.0",
    "pyttsx3>=2.90",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "pytesseract>=0.3",
    "Pillow>=10.0",
    "z3-solver>=4.13",
    "mss>=9.0",
    "webrtcvad>=2.0",
    "piper-tts>=1.2",
]

[project.scripts]
isaac = "isaac.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/isaac"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Allow non-ASCII characters in docstrings, strings and comments
    # (en-dash ranges like "0.0-1.0", multiplication sign in "N*M", arrows in UI hints).
    "RUF001",
    "RUF002",
    "RUF003",
    # Tool/expert ``parameters`` JSON-Schemas are declared as read-only class
    # attributes (the natural place for a tool's signature). They are never
    # mutated, so the mutable-default warning is a false positive here.
    "RUF012",
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# Strict mode is aspirational — the codebase has significant dynamic typing
# (LangGraph state dicts, LLM responses, runtime tool dispatch). The CI keeps
# mypy as an informational check; enable strict mode locally once the
# offending modules are migrated.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
