name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        # ruff is pinned exactly in the [dev] extra, and must stay that way:
        # an unpinned ruff means the rule set is whatever the newest release
        # defaults to. Ruff 0.16.0 widened its built-in defaults and turned a
        # sibling project's CI red with 89 findings in code that had not
        # changed. Installing it from the extra keeps local and CI in step.
        run: pip install -e ".[dev]"

      - name: Ruff lint
        # src/ AND tests/ — same scope as the sibling projects. Test code that
        # nobody lints is where the dead imports and unused bindings collect.
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy type check
        run: mypy src/isaac --ignore-missing-imports

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        # The solver is optional at runtime, but its security regressions must run in CI.
        run: pip install -e ".[dev,reasoning]"

      # No API-key env vars. The default backend is local (Ollama + qwen3.6) and
      # key validation only applies once a cloud provider is selected, so the
      # suite runs keyless. A bare runner is also the honest test of that claim:
      # if something regresses into requiring a cloud key, CI should fail here.
      # Nothing reaches a real Ollama daemon either — those calls are stubbed.
      - name: Run tests
        run: pytest tests/ --tb=short -q
